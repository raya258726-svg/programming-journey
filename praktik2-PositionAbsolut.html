<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container{
      position: relative;
      width: 300px;
      height: 300px;
      background-color: lightsalmon;
    }
    .satu{
      position: absolute;
      top: 190px;
      right: 190px;
      background-color: aquamarine;
      width: 100px;
      height: 100px;
    }
    .dua{
      position: absolute;
      top: 190px;
      left: 190px;
      background-color: plum;
      width: 100px;
      height: 100px;
    }
    .tiga{
      position: absolute;
      bottom: 190px;
      right: 190px;
      background-color: brown;
      width: 100px;
      height: 100px;
    }
    .empat{
      position: absolute;
      bottom: 190px;
      left: 190px;
      background-color: yellow; 
      width: 100px;
      height: 100px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="satu"></div>
    <div class="dua"></div>
    <div class="tiga"></div>
    <div class="empat"></div>
  </div>
</body>
</html>
