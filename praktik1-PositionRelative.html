<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div{
      width: 200px;
      height: 200px;
    }
    .box1{
      background-color: lightblue;
      position: relative;
      right: 50px;
      bottom: 40px;
      width: 150px;
      height: 150px;
    }
    .box2{
      background-color: lightpink;
      position: relative;
      left: 100px;
      bottom: 40px;
      width: 150px;
      height: 150px;
    }
    .box3{
      background-color: lightseagreen;
      position: relative;
      left: 250px;
      bottom: 40px;
      width: 150px;
      height: 150px;
    }
  </style>
</head>
<body>
  <div class="box1">Relative Box</div>
  <div class="box2">Relative Box</div>
  <div class="box3">Relative Box</div>
</body>
</html>
