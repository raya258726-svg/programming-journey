<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas praktik halaman</title>
  <style>
    h1 {
      font-size: 30px;
    }
    
    p {
      font-size: 20pt;
    }

    .box1 {
      width: 15cm;
      height: 10cm;
      background-color: lightpink;
      margin-bottom: 30px;
    }

    .box2 {
      width: 100mm;
      height: 80mm;
      background-color: lightskyblue;
    }
  </style>
</head>
<body>
  
  <div class="h1">
    <h1>Ini judul menggunakan satuan px</h1>
  </div>

  <p class="p">Ini adalah paragraf menggunakan pt</p>

  <div class="box1">Box dengan ukuran cm</div>
  <div class="box2">box dengan ukuran mm</div>

</body>
</html>
