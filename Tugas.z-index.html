<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .picture1{
      width: 100px;
      height: 100px;
      position: absolute;
    }
    .picture2{
      width: 100px;
      height: 100px;
      position: absolute;
      top: 100px;
      left: 100px;
    }
    .picture3{
      width: 100px;
      height: 100px;
      position: absolute;
      top: 200px;
      left: 200px;
    }
  </style>
</head>
<body>
  <div class="picture">

    <div class="picture1">
      <img src="img_forest.jpg.jpeg" alt="">
    </div>

    <div class="picture2">
      <img src="img_lights.jpg.jpeg" alt="">
    </div>

    <div class="picture3">
      <img src="img_mountains.jpg.jpeg" alt="">
    </div>
  </div>
</body>
</html>
